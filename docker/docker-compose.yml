version: '3.8'

services:
  git-workshop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: git-workshop
    hostname: git-workshop
    stdin_open: true
    tty: true
    volumes:
      # Mount the modules for reference (read-only)
      - ../modules:/home/workshop/modules:ro
      # Mount exercises as read-write
      - workshop-exercises:/home/workshop/exercises
    environment:
      - TERM=xterm-256color

volumes:
  workshop-exercises:
